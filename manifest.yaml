manifestVersion: 1
name: "@aaronge/github-trending"
version: "2026.11.05.2"
description: "Snapshots 'trending' GitHub repos using only the official Search API (recently-created, most-starred) -- an honest, stable proxy that doesn't scrape github.com/trending's unstable HTML."

repository: https://github.com/aaron-dernley/github-trending

models:
  - github_trending.ts

workflows:
  - workflow-github-trending.yaml

additionalFiles:
  - README.md
  - LICENSE

platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-aarch64
  - darwin-x86_64

labels:
  - fun
  - github
  - api
